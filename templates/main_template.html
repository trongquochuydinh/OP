<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Data Plotter</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <!-- SheetJS (XLSX parser) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        #plot {
            height: 75vh;   /* 75% of viewport height */
        }

        .container {
            width: 95%;
            margin: auto;
        }

        label {
            font-weight: bold;
        }

        .input-div {
            display: flex;
            justify-content: space-between;
        }

        .edit-div {
            display: flex;
            flex-direction: column;
        }

        #previewWrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 400px;     /* vertical scroll if many rows */
            border: 1px solid #ccc;
        }

        #previewWrapper table {
            border-collapse: collapse;
            min-width: 800px;      /* prevents squashing */
        }

        #previewWrapper th,
        #previewWrapper td {
            padding: 6px;
            white-space: nowrap;   /* prevents line wrapping */
        }

        .chart-type-select, .generate-plot {
            height: 1.3rem;
        }

        #excelRangeInput {
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #previewRangeBtn, #applyRangeBtn {
            padding: 4px 12px;
            border: 1px solid #007ACC;
            background: #007ACC;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        #previewRangeBtn:hover, #applyRangeBtn:hover {
            background: #005a9e;
        }

        #rangeInfo {
            font-style: italic;
        }

        .range-preview-table {
            margin-top: 10px;
            border: 1px solid #ddd;
            max-height: 200px;
            overflow: auto;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Chart Plotter</h2>

    <div class="input-div">
        <div>
            <label for="fileInput">Select File(s) (.xlsx, .yml): </label>
            <input type="file" id="fileInput" accept=".xlsx, .yml" multiple>
            <div style="margin-top: 6px;">
                <label for="sourcePathInput" style="font-weight: normal;">Source path (saved in template): </label>
                <input type="text" id="sourcePathInput" placeholder="/absolute/or/relative/path/to/file.xlsx" style="min-width: 360px;">
                <button type="button" id="loadSourcePathBtn">Load Path Source</button>
            </div>
            <div style="margin-top: 6px;">
                <label for="sourceSelect" style="font-weight: normal;">Active source:</label>
                <select id="sourceSelect" style="min-width: 320px;"></select>
            </div>
            <div id="sheetControls" style="margin-top: 6px; display: none;">
                <label for="sheetSelect" style="font-weight: normal;">Sheet:</label>
                <select id="sheetSelect" style="min-width: 240px;"></select>
                <button type="button" id="loadSheetBtn">Load selected sheet</button>
            </div>
        </div>

        <div>
            <label>Select Chart type: </label>
            <select id="chartTypeInput" class="chart-type-select">
                {% for key, label in chart_types.items() %}
                    <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>

    </div>
    <br>

    <div class="edit-div">
        <div id="templateControls" style="margin-bottom: 12px;">
            <label for="templateNameInput">Template name</label>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input id="templateNameInput" type="text" placeholder="e.g. baseline_salary_view" style="flex: 1;">
                <button type="button" id="saveTemplateBtn">Save Template</button>
                <select id="templateList" style="min-width: 220px;"></select>
                <button type="button" id="loadTemplateBtn">Load Template</button>
            </div>
            <div id="templateInfo" style="margin-top: 6px; font-size: 0.9em; color: #666;"></div>
        </div>

        <!-- Excel Range Selection (only shown for .xlsx files) -->
        <div id="excelRangeDiv" style="display: none;">
            <label for="excelRangeInput">Excel Range (e.g., A2:N28, A, A:C, A,C):</label>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="text" id="excelRangeInput" placeholder="e.g., A2:N28, A, A:C, or B,D" style="flex: 1;">
                <button type="button" id="previewRangeBtn">Preview Range</button>
                <button type="button" id="applyRangeBtn">Apply Range</button>
            </div>
            <div id="rangeInfo" style="margin-top: 5px; font-size: 0.9em; color: #666;"></div>
            <div style="font-size: 0.85em; color: #888; margin-top: 5px;">
                <strong>Plotting logic:</strong> 1 column = frequency chart, 2 columns = X vs Y, 3+ columns = multi-series mode<br>
                <strong>Range formats:</strong> A2:C10 (data subset), A (column), A:C (columns range), B,D (non-neighboring full columns)
            </div>
            <br>
        </div>

        <label>Title</label>
        <input id="plotTitleInput" type="text" placeholder="Plot title">

        <label style="margin-top: 8px;">Chart key (for DOCX placeholders)</label>
        <input id="chartKeyInput" type="text" placeholder="e.g. retention_overview">

        <div id="columnLabelControls" style="margin-top: 10px;">
            <label for="useCustomColumnLabels" style="font-weight: normal;">
                <input type="checkbox" id="useCustomColumnLabels"> Use custom column labels
            </label>
            <div id="columnLabelEditor" style="display: none; margin-top: 8px;"></div>
        </div>
    </div>

    <div>
        <button class="generate-plot">
            Generate plot
        </button>
        <button type="button" id="addChartBtn">
            Save chart to template
        </button>
        <button type="button" id="updateChartBtn">
            Update selected preset
        </button>
        <button type="button" id="renderChartsBtn">
            Render saved charts
        </button>
        <select id="chartPresetList" style="min-width: 240px;"></select>
        <button type="button" id="moveChartUpBtn">
            Move up
        </button>
        <button type="button" id="moveChartDownBtn">
            Move down
        </button>
        <button type="button" id="removeChartBtn">
            Remove preset
        </button>
    </div>

    <div style="margin-top: 14px; border: 1px solid #ddd; padding: 10px;">
        <label style="display: block; margin-bottom: 6px;">Report generation (DOCX placeholder mode)</label>
        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <input type="file" id="docxTemplateInput" accept=".docx">
            <input type="text" id="docxTemplatePathInput" placeholder="or path to template.docx" style="min-width: 320px;">
            <input type="text" id="docxOutputNameInput" placeholder="optional output name" style="min-width: 220px;">
            <button type="button" id="generateDocxBtn">Generate DOCX report</button>
        </div>
        <div id="docxReportInfo" style="margin-top: 8px; font-size: 0.9em; color: #666;"></div>
    </div>

    <div id="plot"></div>
    <div id="savedChartsContainer" style="margin-top: 24px;"></div>

</div>

<script type="module" src="{{ url_for('static', filename='js/main_template.js') }}"></script>

</body>
</html>
